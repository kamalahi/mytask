name: Build APK

# Runs when you push to the main branch, or when you press the button
# on the Actions tab yourself.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew runnable
        run: chmod +x gradlew

      - name: Build the debug APK
        run: ./gradlew assembleDebug --no-daemon

      # The APK lands here as a downloadable zip on the run's page.
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTasks-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
