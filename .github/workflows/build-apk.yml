name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Needed so the last step can commit the finished APKs back into the repo.
    permissions:
      contents: write

    # Lifted to the job so the steps below can test whether the key exists.
    # A secret cannot be read inside an "if:" directly, an env var can.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install the Android SDK pieces this project needs
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Make gradlew runnable
        run: chmod +x gradlew

      - name: Build the debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # Turns the base64 secret back into the .jks file and tells the next step
      # where it landed. Skipped entirely when no key has been added yet.
      - name: Decode the signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: MyTasks-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # Copies whatever got built into dist/, which gives plain download links
      # that work from a phone browser.
      - name: Publish the APKs into the repo
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/app-release.apk
            echo "release APK published"
          else
            echo "no signed release APK this run"
          fi
          ls -lh dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          git commit -m "Publish APKs [skip ci]" || echo "nothing changed"
          git push
