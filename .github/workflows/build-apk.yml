name: Build APK

# Runs when you push to the main branch, or when you press the button
# on the Actions tab yourself.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Needed so the last step can commit the finished APK back into the repo.
    permissions:
      contents: write

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The runner already ships with the Android SDK, so this only adds the
      # exact platform and build-tools this project asks for.
      - name: Install the Android SDK pieces this project needs
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Make gradlew runnable
        run: chmod +x gradlew

      - name: Build the debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # The APK lands here as a downloadable zip on the run's page.
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: MyTasks-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Puts the APK in the repo under dist/, which gives a direct download link
      # that works from a phone browser. The default token does not re-trigger
      # workflows, so this push cannot loop back into another build.
      - name: Publish the APK into the repo
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/app-debug.apk
          git commit -m "Publish debug APK [skip ci]" || echo "APK unchanged, nothing to commit"
          git push
